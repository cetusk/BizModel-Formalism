svg{display:block;min-width:940px;width:100%;height:auto}
.lane{fill:var(--side)}
.lane-t{fill:var(--muted);font-size:11px;letter-spacing:.06em}

.edge.hot{stroke:var(--accent);stroke-width:2.4}
.edge.emp{stroke:var(--warn);stroke-dasharray:5,4}

.nd text{font-size:11px;pointer-events:none}
.nd .t1{font-weight:700}
.nd .t2{fill:var(--muted);font-size:10px}
.nd{cursor:pointer}
.nd.dim{opacity:.18}
.emp rect{fill:var(--warn);stroke:var(--warn)}
.emp text{fill:#fff}

th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
h2{font-size:1rem;margin:2rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}

function layout(){
  const chs=Object.keys(CH).map(Number).sort((a,b)=>a-b);
  const byCh={}; chs.forEach(c=>byCh[c]=[]);
  for(const [k,v] of Object.entries(D.nodes)){
    if(v.chap>=2 && v.chap<=11 && show[v.kind]) (byCh[v.chap]=byCh[v.chap]||[]).push([k,v]);
  }
  const LW=132, GAP=16, TOP=34, RH=30, RG=9;
  const pos={}; let x=10, lanes=[];
  chs.forEach(c=>{
    const arr=(byCh[c]||[]).sort((a,b)=>parseFloat(a[1].num)-parseFloat(b[1].num));
    if(!arr.length){return;}
    lanes.push({c,x,n:arr.length});
    arr.forEach(([k,v],i)=>{pos[k]={x:x, y:TOP+i*(RH+RG), w:LW, h:RH};});
    x += LW+GAP;
  });
  return {pos,lanes,W:x+10};
}

function draw(){
  svg.textContent="";
  const {pos,lanes,W}=layout();
  let maxY=0; for(const k in pos) maxY=Math.max(maxY,pos[k].y+pos[k].h);
  const empY = maxY+56, H = empY+64;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  lanes.forEach(l=>{
    svg.appendChild(el("rect",{x:l.x-7,y:8,width:132+14,height:H-20,class:"lane",rx:6,opacity:.55}));
    const t=el("text",{x:l.x-1,y:22,class:"lane-t"}); t.textContent=`${l.c} ${CH[l.c]}`;
    svg.appendChild(t);
  });

  const gE=el("g"); svg.appendChild(gE);
  D.edges.forEach(([a,b])=>{
    if(!pos[a]||!pos[b]) return;
    const p=pos[a], q=pos[b];
    const x1=p.x+p.w, y1=p.y+p.h/2, x2=q.x, y2=q.y+q.h/2;
    const mx=(x1+x2)/2;
    const path=el("path",{d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,
      class:"edge","data-a":a,"data-b":b});
    gE.appendChild(path);
  });

  // 実証の節点
  const empKeys=Object.keys(D.empname).map(Number).sort((a,b)=>a-b);
  const eW=(W-40)/empKeys.length, ePos={};
  if(showEmp) empKeys.forEach((c,i)=>{
    const x=20+i*eW, y=empY, w=eW-14, h=34;
    ePos[c]={x,y,w,h};
    const g=el("g",{class:"nd emp"});
    g.appendChild(el("rect",{x,y,width:w,height:h,rx:5}));
    const t1=el("text",{x:x+9,y:y+15,class:"t1"}); t1.textContent=`第${c}章`;
    const t2=el("text",{x:x+9,y:y+27,style:"font-size:10px;opacity:.9"});
    t2.textContent=D.empname[c]; g.appendChild(t1); g.appendChild(t2);
    svg.appendChild(g);
    // 実証 → 理論の線
    for(const k in (D.emp[c]||{})){
      if(!pos[k]) continue;
      const p=pos[k];
      gE.appendChild(el("path",{
        d:`M${x+w/2},${y} C${x+w/2},${y-40} ${p.x+p.w/2},${p.y+p.h+40} ${p.x+p.w/2},${p.y+p.h}`,
        class:"edge emp","data-a":k,"data-emp":c}));
    }
  });

  for(const [k,v] of Object.entries(D.nodes)){
    if(!pos[k]) continue;
    const p=pos[k], col=`var(${KIND[v.kind]})`;
    const g=el("g",{class:"nd","data-k":k});
    g.appendChild(el("rect",{x:p.x,y:p.y,width:p.w,height:p.h,
      fill:col,"fill-opacity":.12,stroke:col}));
    const t1=el("text",{x:p.x+8,y:p.y+13,class:"t1",fill:col});
    t1.textContent=`${v.kind} ${v.num}`;
    const t2=el("text",{x:p.x+8,y:p.y+24,class:"t2"});
    t2.textContent=v.title? v.title.slice(0,13) : "";
    g.appendChild(t1); g.appendChild(t2);
    g.addEventListener("click",()=>{sel=(sel===k?null:k); highlight();});
    svg.appendChild(g);
  }
  highlight();
}

function lab(k){const v=D.nodes[k]; return v? `${v.kind}${v.num}`:k;}


function highlight(){
  const keep=new Set();
  if(sel){
    keep.add(sel);
    D.edges.forEach(([a,b])=>{ if(a===sel) keep.add(b); if(b===sel) keep.add(a); });
  }
  svg.querySelectorAll(".nd").forEach(g=>{
    const k=g.getAttribute("data-k");
    g.classList.toggle("dim", !!sel && k && !keep.has(k));
  });
  svg.querySelectorAll(".edge").forEach(p=>{
    const a=p.getAttribute("data-a"), b=p.getAttribute("data-b");
    p.classList.toggle("hot", !!sel && (a===sel||b===sel));
    p.style.opacity = (!sel || a===sel || b===sel) ? "" : ".12";
  });
}

function tables(){
  const rows=[];
  for(const c of Object.keys(D.empname).sort((a,b)=>a-b)){
    const e=D.emp[c]||{};
    const items=Object.entries(e).sort((a,b)=>b[1]-a[1])
      .map(([k,n])=>`${lab(k)}<span style="color:var(--muted)"> ×${n}</span>`).join("、");
    rows.push(`<tr><td>第${c}章 ${D.empname[c]}</td><td class="n">${Object.keys(e).length}</td>
      <td>${items||"—"}</td></tr>`);
  }
  document.getElementById("emptable").innerHTML =
    `<table><tr><th>実証</th><th>参照した理論量</th><th>内訳</th></tr>${rows.join("")}</table>`;

  const used=new Set(); for(const c in D.emp) for(const k in D.emp[c]) used.add(k);
  const orp={};
  for(const [k,v] of Object.entries(D.nodes)){
    if(v.chap>=2&&v.chap<=11&&!used.has(k)) (orp[v.chap]=orp[v.chap]||[]).push(`${v.kind}${v.num}`);
  }
  const r2=Object.keys(orp).sort((a,b)=>a-b).map(c=>
    `<tr><td>第${c}章 ${CH[c]||""}</td><td class="n">${orp[c].length}</td><td>${orp[c].join("、")}</td></tr>`);
  // 連結成分
  const byC={};
  for(const [k,v] of Object.entries(D.nodes)){
    if(v.chap<2||v.chap>11) continue;
    const c=(D.comp&&D.comp[k]!==undefined)?D.comp[k]:-1;
    (byC[c]=byC[c]||[]).push(k);
  }
  const cs=Object.keys(byC).map(Number).sort((a,b)=>byC[b].length-byC[a].length);
  const rc=cs.map(c=>{
    const ks=byC[c].sort((a,b)=>parseFloat(D.nodes[a].num)-parseFloat(D.nodes[b].num));
    const chs=[...new Set(ks.map(k=>D.nodes[k].chap))].sort((a,b)=>a-b);
    const nm = ks.length>=20 ? "中核" : (ks.length===1 ? "孤立" : "島");
    return `<tr><td>${nm}</td><td class="n">${ks.length}</td>
      <td>第${chs[0]}${chs.length>1?"–"+chs[chs.length-1]:""}章</td>
      <td>${ks.map(k=>lab(k)).join("、")}</td></tr>`;
  });
  document.getElementById("comp").innerHTML =
    `<table><tr><th>成分</th><th>節点</th><th>章</th><th>内訳</th></tr>${rc.join("")}</table>`;

  document.getElementById("orphan").innerHTML =
    `<table><tr><th>章</th><th>件数</th><th>節点</th></tr>${r2.join("")}</table>`;
}

const bind=(id,key)=>document.getElementById(id).addEventListener("click",e=>{
  const on=e.target.getAttribute("aria-pressed")==="true";
  e.target.setAttribute("aria-pressed", on?"false":"true");
  if(key==="emp") showEmp=on?0:1; else show[key]=on?0:1;
  draw();
});
bind("b-def","定義"); bind("b-prop","命題"); bind("b-cor","系"); bind("b-eq","式"); bind("b-emp","emp");
document.getElementById("b-reset").addEventListener("click",()=>{sel=null;highlight();});
</script>
</body></html>
