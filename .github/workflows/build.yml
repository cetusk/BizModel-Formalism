name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VERSION: v0.18.1

jobs:
  build:
    runs-on: ubuntu-latest
    # TeX Live 一式と make4ht、dvisvgm を含む公式イメージを用いる。
    # apt での導入は展開とフォーマット生成に 7 分ほどかかるため。
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Japanese fonts and PDF tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            fonts-noto-cjk fonts-noto-cjk-extra mupdf-tools poppler-utils
          fc-cache -fv > /dev/null
          echo "--- available CJK fonts ---"
          fc-list :lang=ja family | sort -u | head -20

      - name: Verify toolchain
        run: |
          lualatex --version | head -1
          dvisvgm --version
          make4ht --version
          mutool -v 2>&1 | head -1 || true
          # 本文で指定するフォント名が解決できるかを先に確かめる
          for f in "Noto Serif CJK JP" "Noto Sans CJK JP" "Latin Modern Roman" "Latin Modern Math"; do
            if fc-list "$f" | grep -q .; then
              echo "OK   $f"
            else
              echo "::error::font not found: $f"
              exit 1
            fi
          done

      - name: Build PDF
        working-directory: src
        run: |
          for i in 1 2 3; do
            lualatex -interaction=nonstopmode book.tex > /dev/null
          done
          pdfinfo book.pdf

      - name: Check for LaTeX errors
        working-directory: src
        run: |
          fail=0
          if grep -q "^!" book.log; then
            echo "::error::LaTeX errors found"
            grep -A3 "^!" book.log | head -40
            fail=1
          fi
          for pat in "Reference.*undefined" "Citation.*undefined" "multiply defined"; do
            n=$(grep -c "$pat" book.log || true)
            echo "$pat: $n"
            if [ "$n" -ne 0 ]; then
              grep "$pat" book.log | head -5
              fail=1
            fi
          done
          exit $fail

      - name: Build figures
        working-directory: src
        run: |
          mkdir -p ../docs/book
          bash build-figures.sh
          n=$(ls ../docs/book/figures/*.svg | wc -l)
          echo "figures: $n"
          if [ "$n" -lt 10 ]; then echo "::error::too few figures"; exit 1; fi
          # 日本語が脱落していないことを確認する
          if ! grep -l "NotoSerifCJK" ../docs/book/figures/*.svg > /dev/null; then
            echo "::error::Japanese font not embedded in figures"
            exit 1
          fi

      - name: Build HTML
        working-directory: src
        run: |
          # make4ht は出力先を空にするため、生成済みの図を退避しておく
          mv ../docs/book/figures /tmp/figs
          rm -rf ../docs/book
          make4ht -l -f html5+dvisvgm_hashes -d ../docs/book book.tex "mathml,2"
          mv /tmp/figs ../docs/book/figures
          n=$(ls ../docs/book/*.html | wc -l)
          echo "generated $n html files"
          if [ "$n" -lt 10 ]; then echo "::error::too few HTML files"; exit 1; fi

      - name: Assemble site
        run: |
          cp src/book.pdf docs/
          cp .github/assets/index.html docs/index.html
          cp .github/assets/style.css  docs/book/custom.css
          cp .github/assets/toc.js     docs/book/toc.js
          cp .github/assets/figures.js docs/book/figures.js
          cp -r .github/assets/fonts   docs/book/fonts
          python3 src/inject-sidebar.py docs/book "$VERSION"
          touch docs/.nojekyll
          echo "html: $(ls docs/book/*.html | wc -l), figures: $(ls docs/book/figures/*.svg | wc -l)"
          ls -la docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # 過去の deployment は不具合の記録でしかないため、最新のもの以外を削除する
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: write
    steps:
      - name: Delete old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deps = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: 'github-pages', per_page: 100 });
            // 新しい順に並べ、先頭以外を削除する
            deps.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const d of deps.slice(1)) {
              const st = await github.rest.repos.listDeploymentStatuses(
                { owner, repo, deployment_id: d.id, per_page: 100 });
              for (const s of st.data) {
                if (s.state !== 'inactive') {
                  await github.rest.repos.createDeploymentStatus(
                    { owner, repo, deployment_id: d.id, state: 'inactive' });
                  break;
                }
              }
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
              core.info(`deleted deployment ${d.id}`);
            }
            core.info(`kept ${deps.length ? deps[0].id : 'none'}`);

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
