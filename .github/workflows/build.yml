name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VERSION: v0.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-texlive-v2

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-lang-japanese \
            texlive-fonts-recommended texlive-plain-generic texlive-pictures \
            fonts-noto-cjk fonts-lmodern dvisvgm poppler-utils mupdf-tools

          # make4ht は Debian パッケージに含まれないため CTAN 版を導入する。
          git clone --depth 1 https://github.com/michal-h21/make4ht.git /tmp/make4ht
          cd /tmp/make4ht

          # 文字定義テーブルはリポジトリに含まれず、ビルド時に生成される。
          texlua tools/make_chardata.lua       > make4ht-char-def.lua
          texlua tools/make_mathmlchardata.lua > make4ht-mathml-char-def.lua

          # ユーザーの texmf ツリーは mktexlsr が走査しないため、
          # kpse の探索パスを環境変数で直接指定する。
          MK4HT_DIR="$HOME/texmf/scripts/lua/make4ht"
          mkdir -p "$MK4HT_DIR"
          cp /tmp/make4ht/*.lua "$MK4HT_DIR/"
          cp /tmp/make4ht/make4ht "$MK4HT_DIR/"
          cp -r /tmp/make4ht/domfilters /tmp/make4ht/filters \
                /tmp/make4ht/extensions /tmp/make4ht/formats "$MK4HT_DIR/"
          chmod +x "$MK4HT_DIR/make4ht"
          sudo ln -sf "$MK4HT_DIR/make4ht" /usr/local/bin/make4ht

          echo "MK4HT_DIR=$MK4HT_DIR"    >> "$GITHUB_ENV"
          echo "LUAINPUTS=$MK4HT_DIR//:" >> "$GITHUB_ENV"
          echo "TEXINPUTS=$MK4HT_DIR//:" >> "$GITHUB_ENV"
          echo "TEXMFHOME=$HOME/texmf"   >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          lualatex --version | head -1
          dvisvgm --version
          mutool -v 2>&1 | head -1 || true
          make4ht --version
          ls "$MK4HT_DIR/make4ht-char-def.lua"
          ls "$MK4HT_DIR/make4ht-mathml-char-def.lua"

      - name: Build PDF
        working-directory: src
        run: |
          for i in 1 2 3; do
            lualatex -interaction=nonstopmode book.tex > /dev/null
          done
          pdfinfo book.pdf

      - name: Check for LaTeX errors
        working-directory: src
        run: |
          fail=0
          if grep -q "^!" book.log; then
            echo "::error::LaTeX errors found"
            grep -A3 "^!" book.log | head -40
            fail=1
          fi
          for pat in "Reference.*undefined" "Citation.*undefined" "multiply defined"; do
            n=$(grep -c "$pat" book.log || true)
            echo "$pat: $n"
            if [ "$n" -ne 0 ]; then
              grep "$pat" book.log | head -5
              fail=1
            fi
          done
          exit $fail

      - name: Build figures
        working-directory: src
        run: |
          mkdir -p ../docs/book
          bash build-figures.sh
          n=$(ls ../docs/book/figures/*.svg | wc -l)
          if [ "$n" -lt 10 ]; then echo "::error::too few figures"; exit 1; fi

      - name: Build HTML
        working-directory: src
        run: |
          # make4ht は出力先を空にするため、生成済みの図を退避しておく
          mv ../docs/book/figures /tmp/figs
          rm -rf ../docs/book
          make4ht -l -f html5+dvisvgm_hashes -d ../docs/book book.tex "mathml,2"
          mv /tmp/figs ../docs/book/figures
          n=$(ls ../docs/book/*.html | wc -l)
          echo "generated $n html files"
          if [ "$n" -lt 10 ]; then echo "::error::too few HTML files"; exit 1; fi

      - name: Assemble site
        run: |
          cp src/book.pdf docs/
          cp .github/assets/index.html docs/index.html
          cp .github/assets/style.css  docs/book/custom.css
          cp .github/assets/toc.js     docs/book/toc.js
          python3 src/inject-sidebar.py docs/book "$VERSION"
          touch docs/.nojekyll
          echo "html: $(ls docs/book/*.html | wc -l), figures: $(ls docs/book/figures/*.svg | wc -l)"
          ls -la docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
